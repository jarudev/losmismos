function counts(){let vals=BANK.map(q=>state.answers[q.id]);return {answered:vals.filter(x=>LETTERS.includes(x)).length,omitted:vals.filter(x=>!LETTERS.includes(x)).length}}
function grading(){const per=SECTIONS.map((_,i)=>BANK.filter(q=>q.section===i+1&&state.answers[q.id]===q.correctAnswer).length),good=per.reduce((a,b)=>a+b,0),bad=BANK.filter(q=>state.answers[q.id]&&state.answers[q.id]!==q.correctAnswer).length;return {per,good,bad,missing:100-good-bad}}
function chrome(){const c=counts();let n=BANK[state.current];return `<div class="sidebar"><div class="row"><strong>Panel de navegación</strong><span class="pill" id="timer">${duration(state.elapsed)}</span></div><div class="progress"><div style="width:${c.answered}%"></div></div><div class="tiny muted">${c.answered}/100 respondidas · ${c.omitted} pendientes</div><div class="sections" style="margin-top:14px">${SECTIONS.map((s,i)=>`<button class="sectionbtn ${n.section===i+1?'active':''}" data-jump="${i*20}">S${i+1}: ${esc(s)}<small>${BANK.filter(q=>q.section===i+1&&state.answers[q.id]).length}/20 respondidas</small></button>`).join("")}</div><div class="gridnav">${BANK.map((q,i)=>`<button title="Pregunta ${q.id}" aria-label="Ir a pregunta ${q.id}" class="navq ${state.answers[q.id]?'done':''} ${i===state.current?'current':''}" data-jump="${i}">${q.id}</button>`).join("")}</div></div>`}
function questionCard(q,review=false){let answer=state.answers[q.id]||"",status=answer===q.correctAnswer?"correct":answer?"incorrect":"omitted";
return `<article class="${review?'reviewitem':'qcard'}"><div class="row"><span class="pill">Pregunta ${q.id} de 100 · S${q.section}</span><span class="tiny muted">${esc(q.competency)}</span></div><h2>${esc(q.topic)}</h2><div class="scenario">${esc(q.scenario)}</div><p><b>${esc(q.question)}</b></p><div class="options">${q.options.map((opt,i)=>{const l=LETTERS[i],chosen=answer===l,right=review&&q.correctAnswer===l;return `<label class="option ${right?'correct':''} ${review&&chosen&&!right?'incorrect':''}"><input ${review?'disabled':''} type="radio" name="q${q.id}" value="${l}" ${chosen?'checked':''} ${review?'':`data-choice="${q.id}"`}><b>${l}.</b><span>${esc(opt)} ${review&&right?' ✓ Correcta':''}${review&&chosen&&!right?' ✗ Elegida':''}</span></label>`}).join("")}</div>${review?`<div class="footnote"><b>${status==="correct"?"✓ Acierto":status==="incorrect"?"✗ Error":"— Omitida"}</b><p>Seleccionada: <b>${esc(answer||"Sin respuesta")}</b> · Correcta: <b>${q.correctAnswer}</b></p><p><b>Explicación:</b> ${esc(q.explanation)}</p><p><b>Por qué se descartan las demás opciones:</b></p><ul>${LETTERS.filter(l=>l!==q.correctAnswer).map(l=>`<li><b>${l}:</b> ${esc(q.distractorExplanations[l])}</li>`).join("")}</ul><dl><dt>Documento</dt><dd>${esc(q.source)}</dd><dt>Apartado</dt><dd>${esc(q.articleOrSection)}</dd><dt>Página del PDF</dt><dd>${q.page} (posición de archivo)</dd><dt>Fundamento</dt><dd>${esc(q.evidence)}</dd></dl></div>`:''}</article>`}
function render(){if(state.mode==="reviewing"){renderReview();return}let q=BANK[state.current],c=counts();
$("app").innerHTML=`<section class="panel" style="margin-bottom:20px"><div class="row"><div><b>Instrucciones</b><div class="muted tiny">Una opción A–D por pregunta; puede cambiarla o quitarla. Las respuestas se califican solo al terminar. Acierto: 1,0; error u omisión: 0,0. Aprueba con 75,0/100,0.</div></div><div><label for="candidate">Nombre (opcional)</label><br><input id="candidate" type="text" maxlength="70" autocomplete="off" value="${esc(state.name)}"></div></div><div class="metrics"><div class="metric">Respondidas<strong>${c.answered}</strong></div><div class="metric">Pendientes<strong>${c.omitted}</strong></div><div class="metric">Avance<strong>${num(c.answered)}%</strong></div><div class="metric">Duración<strong id="timer2">${duration(state.elapsed)}</strong></div></div><p class="tiny muted">Los datos y el resultado se almacenan localmente cuando el navegador lo permite. No se pide información de identificación. Las respuestas correctas se muestran únicamente después de la entrega. Simulacro no oficial elaborado con los archivos de estudio.</p></section><div class="layout">${chrome()}<div><div id="currentcard">${questionCard(q)}</div><div class="controls" style="margin-top:16px"><button class="btn" id="prev" ${state.current===0?'disabled':''}>← Anterior</button><button class="btn" id="clear" ${!state.answers[q.id]?'disabled':''}>Quitar respuesta</button><button class="btn" id="next" ${state.current===99?'disabled':''}>Siguiente →</button><button class="btn primary" id="finishbtn">Terminar y ver mi nota</button></div></div></div>`;
document.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{state.current=+b.dataset.jump;save();render();window.scrollTo({top:0,behavior:"instant"})});
document.querySelectorAll("[data-choice]").forEach(b=>b.onchange=()=>{state.answers[q.id]=b.value;save();render()});
$("prev").onclick=()=>{if(state.current>0){state.current--;save();render()}};
$("next").onclick=()=>{if(state.current<99){state.current++;save();render()}};
$("clear").onclick=()=>{delete state.answers[q.id];save();render()};
$("candidate").oninput=e=>{state.name=e.target.value;save()};
$("finishbtn").onclick=finish;
}
function finish(){const c=counts();if(!confirm(`Tiene ${c.omitted} preguntas sin responder. ¿Desea terminar el simulacro y congelar sus respuestas?`))return;tick();state.mode="reviewing";state.finished=new Date().toISOString();const g=grading();const hash=[g.good,g.bad,g.missing,state.elapsed,...BANK.map(q=>state.answers[q.id]||"-")].join("");let h=2166136261;for(let c of hash){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}state.code="DIAN-T-"+new Date(state.finished).toISOString().replace(/\D/g,"").slice(0,14)+"-"+(h>>>0).toString(36).toUpperCase();save();renderReview();window.scrollTo({top:0})}
function renderReview(){const g=grading(),date=state.finished?new Date(state.finished).toLocaleString("es-CO"):"Sin registrar";
$("app").innerHTML=`<section class="panel"><div class="kicker" style="color:#0d7490">Resultado local · No certifica puntuación oficial</div><h2>Revisión completa: ${esc(state.name||"Aspirante")}</h2><p class="muted">Finalización: ${esc(date)} · Duración: ${duration(state.elapsed)}</p><div class="results"><div class="resultcard">Nota total<strong>${num(g.good)} / 100.0</strong></div><div class="resultcard">Porcentaje<strong>${num(g.good)}%</strong></div><div class="resultcard">Veredicto<strong style="color:${g.good>=75?'#116743':'#b42333'}">${g.good>=75?'Aprobado':'No aprobado'}</strong></div><div class="resultcard">Aciertos / Errores / Omisiones<strong>${g.good} / ${g.bad} / ${g.missing}</strong></div></div><h3>Resultados por sección</h3><div class="results">${SECTIONS.map((s,i)=>`<div class="resultcard"><b>S${i+1} · ${esc(s)}</b><strong>${num(g.per[i])} / 20.0</strong></div>`).join("")}</div><p><b>Código local de resultados:</b> <code id="code">${esc(state.code)}</code></p><div class="controls"><button class="btn primary" id="copybtn">Copiar código de resultados</button><button class="btn danger" id="againbtn">Intentar de nuevo</button><button class="btn" onclick="window.print()">Imprimir revisión</button></div><p class="tiny muted">El código solo identifica este resultado local. No es certificación oficial ni garantía criptográfica. El HTML contiene las claves de corrección en su código fuente.</p></section><h2>Retroalimentación de las 100 preguntas</h2>${BANK.map(q=>questionCard(q,true)).join("")}`;
$("copybtn").onclick=async()=>{let code=state.code;try{await navigator.clipboard.writeText(code);alert("Código copiado")}catch(e){let ta=document.createElement("textarea");ta.value=code;document.body.append(ta);ta.select();let ok=document.execCommand("copy");ta.remove();alert(ok?"Código copiado":"Seleccione el código para copiarlo")}};
$("againbtn").onclick=()=>{if(!confirm("¿Reiniciar? Se borrarán respuestas, puntuación y duración de este intento."))return;state=clean();save();render();window.scrollTo({top:0})};
}
render();setInterval(tick,1000);
</script></body></html>
